name: ci

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '26 16 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  # github.repository as <account>/<repo>
  LATEST: 1.25.1

jobs:
  build:
    strategy:
      matrix:
        image_name: ["c2dalark/unbound"]
        unbound_build: [1.25.1,1.25.0]
        #unbound_build: [1.19.0,1.19.1,1.19.2,1.19.3,1.20.0,1.21.0,1.22.0,1.23.0,1.23.1,1.24.0,1.24.1,1.25.0,1.25.1]
        platform: [linux/amd64,linux/arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      # Setup QEMU for multi-platform builds
      # https://github.com/docker/setup-qemu-action/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 #v4.2.0

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Get the commit timestamp to use for SOURCE_DATE_EPOCH
      # to create reporoducible images
      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        with:
          images: |
            ${{ matrix.image_name }}
          tags: |
            type=sha
            type=raw,${{ matrix.unbound_build }}
            type=raw,v${{ matrix.unbound_build }}
            type=raw,value=latest,enable=${{ matrix.unbound_build == env.LATEST }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.unbound_build }}/
          file: ./${{ matrix.unbound_build }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=inline
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ matrix.unbound_build }}
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:latest
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}
          cache-to: |
            type=inline
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:buildcache,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ matrix.unbound_build }},mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:latest,mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
